services:
  vector_db:
    image: pgvector/pgvector:pg16
    container_name: finder_pgvector
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finder_db}
      POSTGRES_USER: ${POSTGRES_USER:-vector_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vector_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
